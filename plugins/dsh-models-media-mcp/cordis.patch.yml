# dsh-models-media-mcp bundle patch.
# Registers Models 媒体生成 (https://ai.hozonauto.com/mcp/media) as a single Streamable HTTP
# MCP client so its tools surface to the model under the mcp__media__<tool> namespace
# (create_image_task / create_video_task / get_generation_task / cancel_generation_task).
#
# 地址与服务名固定：客户端不接受自定义服务地址，也不自定义模型（服务端固定
# seedream-5.0 / seedance-2.0-fast）。MODELS_API_KEY 通过 DSH credential seam 解析。
#
# failOnStartupError stays false: if the public gateway is briefly unreachable the
# web profile still boots and the reconnect supervisor registers the tools once
# it returns.

- insert:
    - id: mcp-media
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        transport: streamable-http
        serverName: media
        url: 'https://ai.hozonauto.com/mcp/media'
        authorizationCredential: MODELS_API_KEY
        toolCallTimeoutMs: 60000
        failOnStartupError: false
        reconnect:
          enabled: true

    # Registers a system-prompt section telling the model when to reach for the
    # mcp__media__* tools and when to prefer OpenMontage. The module lives in
    # this bundle's index.js.
    - id: models-media-guidance
      name: '@dofe/dsh-models-media-mcp'
